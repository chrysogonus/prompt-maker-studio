# Ruff Configuration
# Fast Python linter and formatter (replacement for Flake8, Black, isort)

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-maker-studio-backend"
version = "0.1.0"
description = "FastAPI backend for Prompt Maker Studio"
license = "Apache-2.0"
authors = [{ name = "Christopher Filsinger" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn==0.27.0",
    "sqlalchemy==2.0.51",
    "pydantic[email]==2.13.4",
    "bcrypt==5.0.0",
    "PyJWT==2.13.0",
    "openai==2.48.0",
    "slowapi==0.1.9",
    "prometheus-fastapi-instrumentator==8.1.0",
    "starlette==1.3.1",
    "cryptography==50.0.0",
    "msgpack==1.2.1",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/chrysogonus/prompt-maker-studio"
Repository = "https://github.com/chrysogonus/prompt-maker-studio"
Issues = "https://github.com/chrysogonus/prompt-maker-studio/issues"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==4.1.0",
    # Starlette >=1.2 uses HTTPX2 for TestClient. Keep legacy httpx as the
    # application's outbound HTTP client until that separate migration.
    "httpx2==2.7.0",
    "ruff==0.16.1",
    "bandit[toml]==1.9.4",
    "pip-audit==2.7.3",
    "pip-tools==7.6.0",
    # pip 26.2 dropped pip._internal.utils.compat.stdlib_pkgs, which pip-tools
    # 7.6.0 (its latest release) imports whenever it reads a config file — so
    # every pip-compile run against a pyproject.toml dies on ImportError.
    # Drop this pin once a pip-tools release supports pip >= 26.2.
    "pip<26.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

# Include/exclude patterns
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "htmlcov",
    ".coverage",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable rule categories
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "PL",    # pylint
    "RUF",   # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR0917", # Too many positional arguments (same established route/service pattern)
    "RUF012",  # Mutable class attributes
    "B008",    # Function call in argument defaults (FastAPI Depends pattern)
    "A003",    # Class attribute shadows Python builtin (id field is standard in ORMs)
    "E402",    # Module level import not at top of file (needed for test setup)
    "ISC001",  # Conflicts with formatter
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in test files
"tests/**/*.py" = [
    "ARG001",  # Unused function arguments (fixtures)
    "ARG002",  # Same, for fixtures requested by a method in a test class
    "PLC0415", # Local imports isolate environment/module state in tests
    "PLR2004", # Magic value comparisons
    "RUF059",  # Unused unpacked values keep tuple-return setup readable
    "S101",    # Use of assert
]
# slowapi requires the `request` parameter by exact name in rate-limited handlers,
# but the function body never references it directly.
"app/api/auth_routes.py" = [
    "ARG001",  # Unused function arguments (slowapi Request injection)
    "PT028",   # FastAPI endpoint name starts with test_ and uses Depends
]
"app/api/routes.py" = [
    "ARG001",  # Unused function arguments (slowapi Request injection)
]
"app/api/eval_routes.py" = [
    "ARG001",  # Unused function arguments (slowapi Request injection)
]
"app/api/refine_routes.py" = [
    "ARG001",  # Unused function arguments (slowapi Request injection)
]
"app/services/secret_store.py" = [
    "PLC0415", # Lazy auth import avoids a module cycle during configuration startup
]
"app/services/spend_ledger.py" = [
    "PLC0415", # Lazy budget_service import avoids a cycle through app.models
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

# ============================================
# Bandit Security Configuration
# ============================================
[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
]
skips = [
    "B101",  # assert_used (okay in tests)
]

# ============================================
# pytest Configuration
# ============================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ============================================
# Coverage Configuration
# ============================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
