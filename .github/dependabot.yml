# Dependabot Configuration
# Automatically creates PRs to update dependencies.
#
# Every ecosystem batches its updates through `groups`, so a run produces one PR
# per group rather than one per dependency. The groups are deliberately
# exhaustive — anything matching no group is opened as its own PR again.
#
# Security updates are alert-driven: they fire immediately and ignore `schedule`
# and `cooldown`. The `*-security` groups keep an alert storm to one PR per
# ecosystem without delaying it.

version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      backend-major:
        patterns:
          - "*"
        update-types:
          - "major"
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Let a release settle before batching it, so a package that ships three
    # times in a fortnight produces one bump instead of a PR that keeps getting
    # force-pushed.
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(backend)"
      include: "scope"
    ignore:
      # Ignore major version updates for stable dependencies
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      frontend-major:
        patterns:
          - "*"
        update-types:
          - "major"
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-major-days: 30
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    ignore:
      # Ignore major version updates for frameworks
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

  # GitHub Actions, pinned by commit SHA in the workflows. A SHA refresh carries
  # no semver classification, so this uses one catch-all group without an
  # `update-types` filter — a filtered group would let those updates fall
  # outside every group and go back to one PR each.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    # SHA pins carry no semver classification, so `semver-*-days` is rejected
    # here — only `default-days` applies.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # Base images, pinned by digest in the Dockerfiles and Compose file. Without
  # this, a digest pin silently freezes those images at whatever was current when
  # the pin was made — including its vulnerabilities.
  #
  # Digest-pinned, so grouped catch-all for the same reason as github-actions.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 2
    groups:
      docker:
        patterns:
          - "*"
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Digest pins, so `semver-*-days` is rejected here too.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
